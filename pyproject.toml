[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlbac-stage1"
version = "0.1.0"
description = "One-step feasibility checks and nonlinear action filtering for MEC resource allocation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scipy>=1.11",
    "stable-baselines3>=2.3",
    "torch>=2.2",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["mlbac_stage1*"]
